name: SOMA Duet V2 D1-D4 Experimental QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  duet-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -- --mode githubpages
      - name: Install FFmpeg for deterministic local VP8 fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Create short local VP8 video for model initialization smoke
        run: |
          ffmpeg -loglevel error -y -f lavfi -i testsrc=size=640x360:rate=24 -t 0.6 -c:v libvpx -b:v 500k e2e/generated-v2-smoke.webm
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c e2e/playwright.config.mjs --project=wide-1440 duet-v2-experiment.spec.mjs
      - name: Upload browser failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: duet-v2-experiment-traces
          path: e2e/test-results/
          if-no-files-found: ignore
