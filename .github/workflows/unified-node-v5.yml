name: Unified Node Canvas V5 browser QA
on:
  pull_request:
    paths:
      - 'src/studio/v5/**'
      - 'e2e/unified-node-v5.spec.mjs'
      - '.github/workflows/unified-node-v5.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false @playwright/test@1.55.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c e2e/playwright.config.mjs e2e/unified-node-v5.spec.mjs --project=wide-1440
