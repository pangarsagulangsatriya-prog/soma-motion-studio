name: SOMA FLOOR — 13 Scene + Audio UAT
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: soma-floor-scene-uat
  cancel-in-progress: true
jobs:
  floor-scene-browser:
    name: 13 scenes, preset, audio, scene switching
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Install pinned Playwright runner without editing production lockfile
        run: npm install --no-save --package-lock=false @playwright/test@1.55.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test FLOOR scene library in laptop and mobile
        run: npx playwright test -c e2e/playwright.config.mjs e2e/floor-scene-library-f5-f6.spec.mjs --project=laptop-1366 --project=mobile-390
      - name: Save failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soma-floor-scenes-uat
          if-no-files-found: ignore
          retention-days: 10
          path: |
            e2e/test-results
            e2e/playwright-report
            e2e/qa-result.json
