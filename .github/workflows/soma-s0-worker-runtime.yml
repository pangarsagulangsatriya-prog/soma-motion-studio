name: SOMA S0 Real Worker Runtime QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s0-worker-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -- --mode githubpages
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c e2e/playwright.config.mjs --project=wide-1440 s0-worker-runtime.spec.mjs
      - name: Upload S0 browser errors
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: soma-s0-worker-errors
          path: e2e/test-results/
          if-no-files-found: ignore
