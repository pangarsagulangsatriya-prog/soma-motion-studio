name: Verify SOMA changes
on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
      - 'wip/**'
      - 'preview/**'
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install Chromium for integrated Composer QA
        if: contains(github.ref_name, 'mat03-compose') || contains(github.head_ref, 'mat03-compose')
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
      - name: MAT-03 integrated Composer Stage Monitor pixel QA
        if: contains(github.ref_name, 'mat03-compose') || contains(github.head_ref, 'mat03-compose')
        run: node scripts/mat03-composer-browser-qa.mjs
      - name: Upload MAT-03 Composer browser evidence
        if: always() && (contains(github.ref_name, 'mat03-compose') || contains(github.head_ref, 'mat03-compose'))
        uses: actions/upload-artifact@v4
        with:
          name: mat03-composer-qa
          path: artifacts/mat03-compose/
          retention-days: 30
          if-no-files-found: warn
      - name: Install Chromium for focused Composer UX QA
        if: contains(github.ref_name, 'cp-ux') || contains(github.head_ref, 'cp-ux')
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
      - name: Composer UX desktop and mobile Chromium QA
        if: contains(github.ref_name, 'cp-ux') || contains(github.head_ref, 'cp-ux')
        run: node scripts/cpux-compose-browser-qa.mjs
      - name: Upload focused Composer UX screenshots
        if: always() && (contains(github.ref_name, 'cp-ux') || contains(github.head_ref, 'cp-ux'))
        uses: actions/upload-artifact@v4
        with:
          name: cpux-compose-qa
          path: artifacts/cpux-compose/
          retention-days: 30
          if-no-files-found: warn
