name: SOMA S6.8.8.3 Temporal Joint QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/footprints/live/**'
      - 'src/engine/**'
      - 'e2e/temporal-joints.spec.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: soma-qa-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  temporal-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -- --mode githubpages
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c e2e/playwright.config.mjs --project=wide-1440 temporal-joints.spec.mjs
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: soma-temporal-joint-failures
          path: e2e/test-results/
          if-no-files-found: ignore
