name: Preview SOMA on GitHub Pages
# Independent browser preview when Vercel production deployments are rate-limited.
# A one-time Settings → Pages → Source: GitHub Actions is required if not enabled.
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: soma-pages-preview
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -- --mode githubpages
      # Browser dependencies are pinned and deliberately ephemeral: npm ci stays reproducible.
      - name: Install TRK-05 browser QA dependencies
        run: npm install --no-save --package-lock=false playwright@1.56.1 pixelmatch@6.0.0 pngjs@7.0.0
      - name: Install Chromium
        run: npx playwright install chromium
      - name: TRK-05 — visual regression and source E2E
        run: node scripts/trk05-browser-qa.mjs
      - name: Upload TRK-05 screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trk05-browser-qa-${{ github.sha }}
          path: artifacts/trk05/
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
