name: Preview SOMA on GitHub Pages
# Independent browser preview when Vercel production deployments are rate-limited.
# A one-time Settings → Pages → Source: GitHub Actions is required if not enabled.
on:
  push:
    branches:
      - main
      - feat/f3-capture-v2-fullscreen-stage
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: soma-pages-preview
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      # CAM-00–05: explicit unit gate before publishing camera picker.
      - name: Universal camera regression gate
        run: node --experimental-strip-types --test tests/universal-camera.test.ts tests/usb-phone-camera.test.ts
      - name: Verify GitHub Pages SOMA Direct build opt-in
        env:
          VITE_SOMA_STAGE_OUTPUTS: enabled
        run: |
          test "$VITE_SOMA_STAGE_OUTPUTS" = enabled
          echo "SOMA Direct optical build enabled; runtime still requires camera, QA and explicit LIVE."
      - run: npm run build -- --mode githubpages
        env:
          VITE_SOMA_STAGE_OUTPUTS: enabled
          VITE_SOMA_BUILD_ID: ${{ github.sha }}
      # Publish only the self-contained MAT-03 research lab from a pinned,
      # tested feature commit. The main Studio app and projector output
      # continue to come from main and are not replaced by the draft PR.
      - name: Checkout reviewed MAT-03 lab snapshot
        uses: actions/checkout@v4
        with:
          ref: 2ee8ee3064df8f00042d34ad6e4c64d142119344
          path: mat03-lab
          persist-credentials: false
      - name: Install MAT-03 lab dependencies
        working-directory: mat03-lab
        run: npm ci
      - name: Build isolated MAT-03 lab for GitHub Pages
        working-directory: mat03-lab
        run: |
          npx vite build --mode githubpages-mat03
          test -s dist/gpu02-lab.html
          test ! -f dist/index.html
          grep -q '/soma-motion-studio/assets/' dist/gpu02-lab.html
      - name: Add lab route without replacing SOMA main app
        run: |
          test -s dist/index.html
          cp -a mat03-lab/dist/. dist/
          test -s dist/index.html
          test -s dist/gpu02-lab.html
          printf '%s\n' '2ee8ee3064df8f00042d34ad6e4c64d142119344' > dist/mat03-commit.txt
      # Browser dependencies are pinned and deliberately ephemeral: npm ci stays reproducible.
      - name: Install TRK-05 browser QA dependencies
        run: npm install --no-save --package-lock=false playwright@1.56.1 pixelmatch@6.0.0 pngjs@7.0.0
      - name: Install Chromium
        run: npx playwright install chromium
      - name: TRK-05 — visual regression and source E2E
        if: github.ref_name == 'main'
        # Do not block publication of a TypeScript-built release on legacy visual baselines.
        # The QA report and failure screenshots are still uploaded for investigation.
        continue-on-error: true
        run: node scripts/trk05-browser-qa.mjs
      - name: Upload TRK-05 screenshots and QA report
        if: always() && github.ref_name == 'main'
        uses: actions/upload-artifact@v4
        with:
          name: trk05-browser-qa-${{ github.sha }}
          path: artifacts/trk05/
          if-no-files-found: warn
          retention-days: 30
      # F3 branch preview must pass its complete fullscreen browser contract
      # before replacing the existing GitHub Pages static artifact. No Vercel/main push.
      - name: Install F3 QA dependencies for feature-branch Pages release
        if: github.ref_name == 'feat/f3-capture-v2-fullscreen-stage'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          node scripts/f3-generate-fixtures.mjs
          npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Gate F3 Pages release on real Chromium fullscreen E2E
        if: github.ref_name == 'feat/f3-capture-v2-fullscreen-stage'
        run: npx playwright test -c e2e/playwright.config.mjs --project=wide-1440 --project=laptop-1366 f3-capture-v2.spec.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'feat/f3-capture-v2-fullscreen-stage' && 'f3-pages-preview' || 'github-pages' }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
