name: Path-first Sumi V3.5 QA
on:
  pull_request:
    paths:
      - 'src/footprints/lines/v3/Path*.ts'
      - 'src/footprints/lines/v3/ActorPathTracker.ts'
      - 'src/footprints/lines/v3/SumiRibbonMeshBuilder.ts'
      - 'src/footprints/lines/v3/DirectionalInkPainter.ts'
      - 'src/footprints/lines/v3/PersistentPathStore.ts'
      - 'src/footprints/lines/v3/PainterlyCanvasRenderer.ts'
      - 'src/studio/v3/LineTrailsV3.tsx'
      - 'src/studio/v3/SurfaceComposer.tsx'
      - 'tests/path-first-sumi-v35.test.ts'
      - 'e2e/path-first-sumi-v35.spec.mjs'
      - '.github/workflows/path-first-sumi-v35-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: soma-v35-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  path-first-v35:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Unit + fixture 30min fast-forward
        run: npm test
      - name: Production TS and Vite build
        run: npm run build
      - name: Install Chromium for canvas pixel checks
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: V3.5 path-first canvas and legacy V3.4 browser QA
        run: npx playwright test -c e2e/playwright.config.mjs --project=wide-1440 path-first-sumi-v35.spec.mjs painterly-sumi-v34.spec.mjs
      - name: Save visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: path-first-v35-before-after
          path: |
            e2e/test-results/
            e2e/playwright-report/
          if-no-files-found: warn
          retention-days: 30
