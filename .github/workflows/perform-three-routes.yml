name: Perform Three Routes UX QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/studio/v3/OperatorStageConsole.tsx'
      - 'src/studio/v3/TouchDesignerPerformPanel.tsx'
      - 'src/studio/v3/performDestinationModel.ts'
      - 'src/studio/v3/perform-three-routes.css'
      - 'src/studio/v3/touchdesigner-perform.css'
      - 'tests/pfux-final-perform.test.ts'
      - 'e2e/perform-three-routes.spec.mjs'
permissions:
  contents: read
concurrency:
  group: soma-qa-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  output-ux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -- --mode githubpages
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Desktop and mobile three-route Perform UX
        run: npx playwright test -c e2e/playwright.config.mjs --project=wide-1440 --project=mobile-390 perform-three-routes.spec.mjs
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: perform-three-route-failure
          path: e2e/test-results/
          if-no-files-found: ignore
