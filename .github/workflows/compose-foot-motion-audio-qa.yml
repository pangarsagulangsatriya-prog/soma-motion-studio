name: Compose Foot Motion Audio QA
on:
  pull_request:
    paths:
      - 'src/engine/audio.ts'
      - 'src/studio/v3/experimentalFootAudio.ts'
      - 'src/studio/v3/foot-motion-audio.css'
      - 'src/studio/v3/FootMotionAudioPanel.tsx'
      - 'src/studio/v3/footMotionAudioModel.ts'
      - 'src/studio/v3/SurfaceComposer.tsx'
      - 'src/studio/v3/FootprintsStageWorkspace.tsx'
      - 'src/App.tsx'
      - 'tests/foot-motion-audio.test.ts'
      - 'e2e/compose-foot-motion-audio.spec.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compose-audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -- --mode githubpages
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install chromium
      - run: npx playwright test -c e2e/playwright.config.mjs --project=wide-1440 compose-foot-motion-audio.spec.mjs
