name: Map R3/R4 Calibration UX QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/studio/v3/MapWysiwygWorkspace.tsx'
      - 'src/studio/v3/useMapCalibrationAssist.ts'
      - 'src/studio/v3/mapCalibrationAssist.ts'
      - 'src/footprints/stage-optics/DualSurfaceRoutingPanel.tsx'
      - 'e2e/map-v6-stage-inspector.spec.mjs'
      - '.github/workflows/map-r3-release.yml'
  pull_request:
    paths:
      - 'src/studio/v3/MapWysiwygWorkspace.tsx'
      - 'src/studio/v3/useMapCalibrationAssist.ts'
      - 'src/studio/v3/mapCalibrationAssist.ts'
      - 'e2e/map-v6-stage-inspector.spec.mjs'
      - 'src/studio/v3/MapStageMonitor.tsx'
      - 'src/studio/v3/mapStageModel.ts'
      - 'src/footprints/stage-optics/DualSurfaceRoutingPanel.tsx'
      - 'src/footprints/stage-optics/dual-surface-routing.css'
      - 'e2e/map-r3-fullscreen.spec.mjs'
      - 'e2e/map-r4-compact.spec.mjs'
      - 'tests/map-r3-camera-grid.test.ts'
      - '.github/workflows/map-r3-release.yml'
permissions:
  contents: read
concurrency:
  group: soma-qa-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  map-r3:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Map R3/R4 fullscreen and compact calibration UX desktop + mobile
        run: npx playwright test -c e2e/playwright.config.mjs --project=wide-1440 --project=mobile-390 map-r3-fullscreen.spec.mjs map-r4-compact.spec.mjs map-v6-stage-inspector.spec.mjs map-calibration-assist.spec.mjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: map-r3-e2e-failure
          path: e2e/test-results/
          if-no-files-found: ignore
