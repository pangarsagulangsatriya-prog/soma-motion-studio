name: V5 Reset Browser QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/footprints/scenes/**'
      - 'src/studio/v3/**'
      - 'scripts/v5-reset-browser-qa.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: soma-qa-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  reset-browser-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build -- --mode githubpages
      - name: Install Chromium QA runner
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install chromium
      - name: Verify reset, Track and Map in a real browser
        run: node scripts/v5-reset-browser-qa.mjs
      - name: Upload reset screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-reset-browser-${{ github.sha }}
          path: artifacts/v5-reset
          if-no-files-found: warn
          retention-days: 30
