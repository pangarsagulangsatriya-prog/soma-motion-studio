name: V5 Reset Browser QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/footprints/scenes/**'
      - 'src/footprints/spatial/events.ts'
      - 'src/footprints/simulator/**'
      - 'tests/geo01b-dynamic-foot-deformation.test.ts'
      - 'scripts/geo01b-browser-qa.mjs'
      - 'src/studio/v3/**'
      - 'scripts/v5-reset-browser-qa.mjs'
      - '.github/workflows/fv-material-pixel-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reset-browser-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run regression tests (RESET-00 / GEO-01 / GEO-01B)
        run: npm test
      - run: npm run build -- --mode githubpages
      - name: Install Chromium QA runner
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install chromium
      - name: Verify reset, Track, Map and Perform in Chromium
        run: node scripts/v5-reset-browser-qa.mjs
      - name: Verify anatomical and dynamic footprint pixels in Chromium
        run: node scripts/geo01b-browser-qa.mjs
      - name: Upload reset screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-reset-browser-${{ github.sha }}
          path: |
            artifacts/v5-reset
            artifacts/geo01b
          if-no-files-found: warn
          retention-days: 30
