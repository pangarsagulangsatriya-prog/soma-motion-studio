name: V5.1 Signal Workspace QA
on:
  pull_request:
    paths:
      - 'src/studio/v51/**'
      - 'src/studio/v53/**'
      - 'src/studio/v54/**'
      - 'tests/v54-graph-view.test.ts'
      - 'e2e/v54-graph.spec.mjs'
      - 'tests/v53-adaptive.test.ts'
      - 'e2e/v53-adaptive.spec.mjs'
      - 'src/main.tsx'
      - 'tests/v51-signal.test.ts'
      - 'e2e/v51-signal.spec.mjs'
      - '.github/workflows/v51-signal-qa.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -- --mode githubpages
      - run: npm install --no-save --package-lock=false @playwright/test@1.55.1
      - run: npx playwright install chromium
      - run: npx playwright test -c e2e/playwright.config.mjs e2e/v51-signal.spec.mjs e2e/v53-adaptive.spec.mjs e2e/v54-graph.spec.mjs --project=wide-1440
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v51-browser-qa
          path: |
            e2e/test-results
            e2e/playwright-report
          if-no-files-found: ignore
