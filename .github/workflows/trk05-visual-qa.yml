name: TRK-05 Full Visual Regression (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: soma-qa-trk05-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visual-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build main Studio
        run: npm run build -- --mode githubpages
      - name: Install browser dependencies
        run: npm install --no-save --package-lock=false playwright@1.56.1 pixelmatch@6.0.0 pngjs@7.0.0
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Full TRK-05 visual and source E2E
        run: node scripts/trk05-browser-qa.mjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trk05-full-qa-${{ github.sha }}
          path: artifacts/trk05/
          if-no-files-found: warn
          retention-days: 30
