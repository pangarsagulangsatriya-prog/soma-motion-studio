name: ENGINE-02 lockfile bootstrap (feature branch only)
on:
  push:
    branches:
      - feat/v5-gpu02-liquid-imprint-spike
    paths:
      - package.json
permissions:
  contents: write
jobs:
  generate-lockfile:
    if: github.repository == 'pangarsagulangsatriya-prog/soma-motion-studio'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit deterministic Pixi dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(ENGINE-02): lock PixiJS v8.23.0 dependencies"
            git push origin HEAD:feat/v5-gpu02-liquid-imprint-spike
          fi
