name: REC-01 MP4 Recovery
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-mp4-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VITE_SOMA_STAGE_OUTPUTS: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c e2e/playwright.config.mjs --project=wide-1440 --workers=1 rec01-mp4-recovery.spec.mjs
      - name: Upload actual browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rec01-mp4-browser-evidence
          path: |
            e2e/test-results/
            test-results/
            playwright-report/
            qa-result.json
          if-no-files-found: warn
