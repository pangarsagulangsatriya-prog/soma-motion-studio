name: SOMA Ground Trajectory V2.2 QA
on:
  push:
    branches: [main]
    paths:
      - 'src/footprints/lines/v3/ActorMotionFrameBuilder.ts'
      - 'src/footprints/lines/v3/ActorGroundTrajectoryEstimator.ts'
      - 'src/footprints/lines/v3/GroundTrajectoryEngineV2.ts'
      - 'src/footprints/lines/v3/PathObservationRouter.ts'
      - 'src/footprints/lines/v3/ActorPathTracker.ts'
      - 'src/studio/v3/LineTrailsV3.tsx'
      - 'tests/ground-trajectory-v22.test.ts'
      - 'e2e/ground-trajectory-v22.spec.mjs'
      - '.github/workflows/trajectory-v22-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: soma-trajectory-v22-qa
  cancel-in-progress: true
jobs:
  trajectory-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Dependencies
        run: npm ci
      - name: Path/hip regression suite
        run: npm test
      - name: TypeScript + production build
        run: npm run build
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Visual trajectory and rollback browser QA
        run: npx playwright test -c e2e/playwright.config.mjs --project=wide-1440 ground-trajectory-v22.spec.mjs
      - name: Preserve pixel evidence and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soma-ground-trajectory-v22-qa
          path: |
            e2e/test-results/
            e2e/playwright-report/
            e2e/qa-result.json
          if-no-files-found: ignore
          retention-days: 14
