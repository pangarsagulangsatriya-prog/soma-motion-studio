name: Compose Stage Monitor Fullscreen QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/studio/v3/SurfaceComposer.tsx'
      - 'src/studio/v3/ux-r3-compose.css'
      - 'e2e/compose-monitor-fullscreen.spec.mjs'
      - '.github/workflows/compose-monitor-fullscreen.yml'
permissions:
  contents: read
concurrency:
  group: soma-qa-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  fullscreen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -- --mode githubpages
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Desktop + mobile Stage Monitor fullscreen E2E
        run: npx playwright test -c e2e/playwright.config.mjs --project=wide-1440 --project=mobile-390 compose-monitor-fullscreen.spec.mjs
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-monitor-fullscreen-failure
          path: e2e/test-results/
          if-no-files-found: ignore
