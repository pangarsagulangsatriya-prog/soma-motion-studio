name: Painterly Sumi V3.4 QA
on:
  pull_request:
    paths:
      - 'src/footprints/lines/v3/**'
      - 'src/studio/v3/LineTrailsV3.tsx'
      - 'src/studio/v3/SurfaceComposer.tsx'
      - 'tests/painterly-sumi-v34.test.ts'
      - 'e2e/painterly-sumi-v34.spec.mjs'
      - '.github/workflows/painterly-sumi-v34-qa.yml'
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  sumi-v34:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Unit + all-source parity + accelerated 30 minute soak
        run: npm test
      - name: TypeScript and Vite production build
        run: npm run build
      - name: Chromium
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Sumi V3.4 + legacy Painterly smoke E2E (two viewports)
        run: npx playwright test -c e2e/playwright.config.mjs --project=wide-1440 --project=laptop-1366 painterly-sumi-v34.spec.mjs painterly-footprint-trail.spec.mjs
      - name: Browser screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sumi-v34-qa-evidence
          path: |
            e2e/test-results/
            e2e/playwright-report/
          if-no-files-found: warn
