name: SOMA Source Browser QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/studio/v3/CameraHub*'
      - 'src/studio/v3/experimentSourceModel.ts'
      - 'src/studio/v3/FootprintsExperimentalSource.tsx'
      - 'e2e/source-flow.spec.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: soma-qa-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c e2e/playwright.config.mjs --project=wide-1440 source-flow.spec.mjs
      - name: Upload failure trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: soma-source-browser-traces
          path: test-results/
          if-no-files-found: ignore
