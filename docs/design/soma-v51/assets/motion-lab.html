<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOMA V5.1 — Motion Lab</title><link rel="stylesheet" href="tokens.css"><style>
*{box-sizing:border-box}body{margin:0;background:var(--soma-bg);color:var(--soma-text);font:13px/1.5 var(--soma-font)}main{max-width:960px;margin:0 auto;padding:24px}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:20px;margin:0}small,p{color:var(--soma-muted)}button,select{background:var(--soma-raised);color:var(--soma-text);border:1px solid var(--soma-border);border-radius:6px;padding:9px 12px;font:inherit;cursor:pointer;transition:border-color var(--soma-motion-fast),background var(--soma-motion-fast)}button:hover{border-color:var(--soma-accent)}button:focus-visible,select:focus-visible{outline:2px solid var(--soma-focus);outline-offset:2px}button[aria-pressed=true]{border-color:var(--soma-focus);background:#34483a}button:disabled{opacity:.5;cursor:default}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.panel{background:var(--soma-panel);border:1px solid var(--soma-border);border-radius:8px;padding:16px;margin-top:16px}.graph{position:relative;width:100%;min-height:190px;background:radial-gradient(var(--soma-border) .7px,transparent .7px) 0 0/18px 18px,var(--soma-canvas);border-radius:6px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8%;align-items:center;padding:24px 4%}.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.node{position:relative;background:var(--soma-raised);border:1px solid var(--soma-border);border-radius:8px;padding:12px;min-height:72px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;transition:border-color 150ms,opacity 150ms}.node[data-state=ready]{border-color:var(--soma-accent)}.node[data-state=error]{border-color:var(--soma-danger)}.node[data-state=stale]{border-color:var(--soma-warning)}.node .state{font-size:11px;color:var(--soma-muted)}.preview{width:100%;aspect-ratio:16/9;border-radius:4px;background:#0a100c;display:grid;place-items:center;overflow:hidden}.preview svg{width:100%;height:100%}.monitors{display:grid;grid-template-columns:1fr 1fr;gap:12px}.monitor{min-width:0}.monitor>div:first-child{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-bottom:6px}.monitor .preview[data-black=true]{background:#000;transition:none}.monitor .preview[data-black=true] svg{visibility:hidden}.cue{min-width:90px}.go{background:var(--soma-accent);color:#111714;font-weight:700}.danger{background:#462a2a;border-color:#6b3d39;color:#ffd3ce}.state-line{min-height:24px;color:var(--soma-muted)}.rec{color:#ffc4bf}.badge{font-size:11px;color:var(--soma-muted);border:1px solid var(--soma-border);padding:2px 6px;border-radius:4px}.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.slot{height:54px;display:grid;place-items:center;border:1px dashed var(--soma-border);border-radius:4px;color:var(--soma-muted)}.slot.filled{border-style:solid;background:#304639;color:var(--soma-text)}@media(max-width:560px){main{padding:12px}.graph{gap:3%;padding:12px 2%}.node{padding:6px;font-size:12px}.monitors{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}[data-reduced-motion=true] *{transition:none!important}
</style></head><body><main><header><h1>SOMA / Motion Lab</h1><span class="badge">SIMULASI UI · NO CAMERA</span><label style="margin-left:auto"><input id="reduce" type="checkbox"> Reduced motion</label></header><p>Contoh state dan micro-interaction untuk Figma; tidak tersambung ke engine atau proyektor.</p>
<section class="panel"><h2 style="font-size:14px;margin-top:0">01 · Signal state</h2><div class="row" id="states"><button data-state="idle">Standby</button><button data-state="connecting">Connecting</button><button data-state="ready">Ready</button><button data-state="processing">Processing</button><button data-state="stale">Stale</button><button data-state="error">Error</button><button id="event">Event pulse</button></div>
<div class="graph"><svg class="wires" viewBox="0 0 800 200" preserveAspectRatio="none" aria-hidden="true"><path id="wireBase" d="M220 100H340 M460 100H580" fill="none" stroke="#53665A" stroke-width="2"/><path id="wireFlow" d="M220 100H340 M460 100H580" fill="none" stroke="#D4E8BF" stroke-width="3" style="display:none"/></svg><button class="node" id="node1"><b>Performer</b><span class="state" id="s1">Standby</span></button><button class="node" id="node2"><b>Motion</b><span class="state" id="s2">Idle</span></button><button class="node" id="node3"><b>Footprint</b><span class="state" id="s3">Idle</span></button></div><div id="inspect" class="state-line" role="status">Pilih node untuk melihat detail.</div></section>
<section class="panel"><h2 style="font-size:14px;margin-top:0">02 · Cue / Record / Blackout</h2><div class="row" id="cues"><button class="cue" data-cue="F1">F1 · Jejak</button><button class="cue" data-cue="F2">F2 · Arsip</button><button class="cue" data-cue="F3A">F3A · Foto</button><button class="cue" data-cue="F3B">F3B · Replay</button><button class="go" id="go">GO</button><button id="rec">Record</button><button id="stop">Stop</button><button class="danger" id="black">Blackout</button></div><p id="transport" role="status"></p><div class="monitors"><div class="monitor"><div><b>Floor</b><button data-surface="floor">Blackout</button></div><div class="preview" id="floor" data-black="true"><svg viewBox="0 0 320 180"><rect width="320" height="180" fill="#080b09"/><g fill="#A7D4A8"><ellipse cx="60" cy="138" rx="6" ry="12" transform="rotate(25 60 138)"/><ellipse cx="98" cy="114" rx="6" ry="12" transform="rotate(25 98 114)"/><ellipse cx="136" cy="96" rx="6" ry="12" transform="rotate(25 136 96)"/><ellipse cx="174" cy="73" rx="6" ry="12" transform="rotate(25 174 73)"/><ellipse cx="212" cy="55" rx="6" ry="12" transform="rotate(25 212 55)"/></g></svg></div></div><div class="monitor"><div><b>Canvas</b><button data-surface="canvas">Blackout</button></div><div class="preview" id="canvas" data-black="true"><svg viewBox="0 0 320 180"><rect width="320" height="180" fill="#F7F6F2"/><path d="M0 120Q75 10 120 85T230 70T320 120" fill="none" stroke="#E84B32" stroke-width="5" stroke-linecap="round"/><path d="M0 40Q90 170 155 80T320 50" fill="none" stroke="#202226" stroke-width="4" stroke-linecap="round"/></svg></div></div></div></section>
<section class="panel"><h2 style="font-size:14px;margin-top:0">03 · Photo feedback</h2><div class="row"><label><input type="checkbox" id="consent"> Persetujuan simulasi</label><button id="photo">Capture</button><button id="clear">Hapus foto</button><span id="photoCount">0/4 foto</span></div><div class="slots" id="slots" style="margin-top:12px"></div></section>
</main><script>
let state='idle',next='F1',running=null,record=false,count=0;let latch={floor:false,canvas:false};
const el=id=>document.getElementById(id);
function renderSignal(){document.querySelectorAll('#states [data-state]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.state===state)));let status={idle:'Standby',connecting:'Connecting…',ready:'Ready',processing:'Processing',stale:'Stale',error:'Disconnected'};el('s1').textContent=status[state];el('s2').textContent=state==='processing'?'Processing':state==='ready'?'Ready':'Idle';el('s3').textContent=el('s2').textContent;el('node1').dataset.state=state==='processing'?'ready':state;el('node2').dataset.state=el('node3').dataset.state=['ready','processing'].includes(state)?'ready':'idle';el('wireBase').setAttribute('stroke',state==='error'?'#D96C62':state==='stale'?'#E3BD79':['ready','processing'].includes(state)?'#A7D4A8':'#53665A');el('wireBase').setAttribute('stroke-dasharray',state==='stale'?'5 4':state==='error'?'2 8':'none');el('wireFlow').style.display=state==='processing'?'':'none';el('wireFlow').classList.toggle('soma-flow-active',state==='processing')}
document.querySelectorAll('#states [data-state]').forEach(b=>b.onclick=()=>{state=b.dataset.state;renderSignal();if(['stale','error'].includes(state)){latch.floor=latch.canvas=true;renderTransport()}});document.querySelectorAll('.node').forEach(n=>n.onclick=()=>{document.querySelectorAll('.node').forEach(x=>x.setAttribute('aria-pressed',String(x===n)));el('inspect').textContent=n.querySelector('b').textContent+' · '+n.querySelector('.state').textContent+' · fixture state';el('inspect').classList.remove('soma-enter');void el('inspect').offsetWidth;el('inspect').classList.add('soma-enter')});el('event').onclick=()=>{if(state!=='processing'){el('inspect').textContent='Pilih Processing untuk simulasi event.';return}let w=el('wireBase');w.classList.remove('soma-event-pulse');void w.getBoundingClientRect();w.classList.add('soma-event-pulse')};
function renderTransport(){document.querySelectorAll('[data-cue]').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.cue===next));b.style.boxShadow=b.dataset.cue===running?'inset 0 -3px #A7D4A8':''});el('transport').textContent='Running: '+(running||'—')+' · Next: '+next+(record?' · REC':'')+(latch.floor&&latch.canvas?' · BLACKOUT':'');el('rec').textContent=record?'Stop REC':'Record';el('rec').disabled=running!=='F1';el('rec').classList.toggle('rec',record);['floor','canvas'].forEach(s=>{el(s).dataset.black=String(!running||latch[s]||(s==='floor'&&['F2','F3A'].includes(running)));let b=document.querySelector('[data-surface="'+s+'"]');b.textContent=latch[s]?'Resume':'Blackout';b.setAttribute('aria-pressed',String(latch[s]))})}
document.querySelectorAll('[data-cue]').forEach(b=>b.onclick=()=>{next=b.dataset.cue;renderTransport()});el('go').onclick=()=>{if(!['ready','processing'].includes(state)){el('transport').textContent='GO tertahan: pilih Ready atau Processing pada simulasi.';return}if(running==='F1'&&next!=='F1')record=false;running=next;renderTransport()};el('rec').onclick=()=>{record=!record;renderTransport()};el('stop').onclick=()=>{running=null;record=false;renderTransport()};el('black').onclick=()=>{latch.floor=latch.canvas=true;renderTransport()};document.querySelectorAll('[data-surface]').forEach(b=>b.onclick=()=>{let s=b.dataset.surface;if(latch[s]&&!['ready','processing'].includes(state)){el('transport').textContent='Resume tertahan: signal belum siap.';return}latch[s]=!latch[s];renderTransport()});
function renderPhotos(){el('slots').replaceChildren();for(let i=0;i<4;i++){let d=document.createElement('div');d.className='slot'+(i<count?' filled':'');d.textContent=i<count?'Foto '+(i+1):String(i+1).padStart(2,'0');el('slots').append(d)}el('photoCount').textContent=count+'/4 foto';el('photo').disabled=!el('consent').checked||count===4}
el('consent').onchange=()=>{if(!el('consent').checked)count=0;renderPhotos()};el('photo').onclick=()=>{if(!el('consent').checked||count>=4)return;count++;renderPhotos();el('slots').children[count-1].classList.add('soma-enter')};el('clear').onclick=()=>{count=0;renderPhotos()};el('reduce').onchange=e=>document.body.dataset.reducedMotion=String(e.target.checked);renderSignal();renderTransport();renderPhotos();
</script></body></html>
